      <circle cx="49" cy="56" r="3.4" fill="#5a4150"/><circle cx="71" cy="56" r="3.4" fill="#5a4150"/>
      <ellipse cx="42" cy="66" rx="6" ry="3.6" fill="#ff9fbf"/><ellipse cx="78" cy="66" rx="6" ry="3.6" fill="#ff9fbf"/>
