      <use href="#daisy" x="40" y="160" opacity=".8" transform="translate(40 160) scale(.5) translate(-40 -160)"/>
      <circle cx="120" cy="40" r="3" fill="#fff" opacity=".9"/><circle cx="92" cy="110" r="2.4" fill="#ffb5d4" opacity=".8"/><circle cx="178" cy="30" r="2.4" fill="#ffb5d4" opacity=".8"/>
    </pattern>
    <g id="sun">
