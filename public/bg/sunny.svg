        <ellipse cx="0" cy="-12" rx="5" ry="9" transform="rotate(180)"/><ellipse cx="0" cy="-12" rx="5" ry="9" transform="rotate(240)"/><ellipse cx="0" cy="-12" rx="5" ry="9" transform="rotate(300)"/>
      </g>
      <circle r="6" fill="#ffc83d"/>
