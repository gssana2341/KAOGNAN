<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a6"/><stop offset=".7" stop-color="#ffe9c9"/><stop offset="1" stop-color="#ffdff0"/>
    </linearGradient>
    <g id="daisy">
