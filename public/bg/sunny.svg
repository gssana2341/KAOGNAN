        <path d="M60 4 v14"/><path d="M60 102 v14"/><path d="M4 60 h14"/><path d="M102 60 h14"/>
        <path d="M20 20 l10 10"/><path d="M90 90 l10 10"/><path d="M100 20 l-10 10"/><path d="M30 90 l-10 10"/>
