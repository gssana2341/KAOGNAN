<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6cc"/><stop offset="1" stop-color="#fff7ec"/>
    </linearGradient>
    <g id="paw">
      <ellipse cx="0" cy="8" rx="13" ry="11"/>
      <ellipse cx="-16" cy="-8" rx="5.6" ry="7.6" transform="rotate(-22 -16 -8)"/>
      <ellipse cx="-6" cy="-17" rx="5.6" ry="7.8"/>
      <ellipse cx="6" cy="-17" rx="5.6" ry="7.8"/>
      <ellipse cx="16" cy="-8" rx="5.6" ry="7.6" transform="rotate(22 16 -8)"/>
    </g>
    <pattern id="p" width="190" height="190" patternUnits="userSpaceOnUse">
      <use href="#paw" x="48" y="50" fill="#ffb691" opacity=".5" transform="rotate(-20 48 50)"/>
      <use href="#paw" x="142" y="140" fill="#ffb691" opacity=".5" transform="rotate(25 142 140)"/>
      <use href="#paw" x="150" y="40" fill="#fff" opacity=".8" transform="translate(150 40) scale(.6) translate(-150 -40)"/>
      <use href="#paw" x="40" y="150" fill="#fff" opacity=".8" transform="translate(40 150) scale(.6) translate(-40 -150)"/>
      <circle cx="96" cy="96" r="3" fill="#ffc9a8" opacity=".7"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <rect width="100%" height="100%" fill="url(#p)"/>
</svg>
