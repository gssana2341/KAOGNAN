<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2263"/><stop offset=".6" stop-color="#5d4296"/><stop offset="1" stop-color="#b98ad0"/>
    </linearGradient>
    <path id="s" d="M0 -10 L2.6 -2.6 L10 0 L2.6 2.6 L0 10 L-2.6 2.6 L-10 0 L-2.6 -2.6Z"/>
    <pattern id="p" width="190" height="190" patternUnits="userSpaceOnUse">
      <use href="#s" x="34" y="30" fill="#fff6c9" opacity=".95"/>
      <use href="#s" x="140" y="70" fill="#fff" opacity=".8" transform="translate(140 70) scale(.6) translate(-140 -70)"/>
      <use href="#s" x="80" y="150" fill="#ffd9f1" opacity=".85" transform="translate(80 150) scale(.8) translate(-80 -150)"/>
      <circle cx="100" cy="36" r="2" fill="#fff" opacity=".8"/><circle cx="170" cy="150" r="2.2" fill="#fff" opacity=".8"/>
      <circle cx="18" cy="110" r="1.8" fill="#fff" opacity=".7"/><circle cx="130" cy="120" r="1.6" fill="#fff" opacity=".7"/>
    </pattern>
    <mask id="cut"><rect x="-100" y="-100" width="400" height="400" fill="#fff"/><circle cx="66" cy="38" r="36" fill="#000"/></mask>
    <g id="moon"><circle cx="46" cy="46" r="40" fill="#fff3b0" mask="url(#cut)"/></g>
    <g id="cloud" fill="#d9c5f2" opacity=".55"><circle cx="20" cy="30" r="17"/><circle cx="46" cy="21" r="22"/><circle cx="72" cy="31" r="16"/><rect x="8" y="31" width="76" height="20" rx="10"/></g>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <rect width="100%" height="100%" fill="url(#p)"/>
  <use href="#moon" x="78%" y="6%"/>
  <use href="#cloud" x="8%" y="72%"/>
  <use href="#cloud" x="62%" y="84%"/>
</svg>
